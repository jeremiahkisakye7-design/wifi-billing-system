services:
  - type: web
    name: wifi-billing-system
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: PAYMENT_PROVIDER
        sync: false
      - key: MTN_MERCHANT_CODE
        sync: false
      - key: MTN_COLLECTION_PRIMARY_KEY
        sync: false
      - key: MTN_API_USER
        sync: false
      - key: MTN_API_KEY
        sync: false
      - key: MTN_TARGET_ENVIRONMENT
        sync: false
      - key: AIRTEL_MERCHANT_CODE
        sync: false
      - key: AIRTEL_CLIENT_ID
        sync: false
      - key: AIRTEL_CLIENT_SECRET
        sync: false
      - key: PAYMENT_CALLBACK_BASE_URL
        sync: false
      - key: PAYMENT_WEBHOOK_SECRET
        sync: false
