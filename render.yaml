services:
  - type: web
    name: wifi-billing-system
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 8 --timeout 30
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: PAYMENT_PROVIDER
        sync: false
      - key: MTN_MERCHANT_CODE
        sync: false
      - key: MTN_COLLECTION_PRIMARY_KEY
        sync: false
      - key: MTN_API_USER
        sync: false
      - key: MTN_API_KEY
        sync: false
      - key: MTN_TARGET_ENVIRONMENT
        sync: false
      - key: AIRTEL_MERCHANT_CODE
        sync: false
      - key: AIRTEL_CLIENT_ID
        sync: false
      - key: AIRTEL_CLIENT_SECRET
        sync: false
      - key: AIRTEL_TARGET_ENVIRONMENT
        sync: false
      - key: PAYMENT_CALLBACK_BASE_URL
        sync: false
      - key: PAYMENT_WEBHOOK_SECRET
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: ADMIN_TOTP_SECRET
        sync: false
      - key: TRUST_PROXY_HEADERS
        value: "true"
      - key: MANUAL_PAYMENT_RECIPIENT
        sync: false
      - key: SUPPORT_INQUIRY_NUMBER
        sync: false
      - key: ROUTER_API_KEY
        sync: false
      - key: AT_USERNAME
        sync: false
      - key: AT_API_KEY
        sync: false
      - key: AT_SENDER_ID
        sync: false
      - key: ROUTER_MAC_SIGNING_SECRET
        sync: false
      - key: MAX_DEVICES_PER_VOUCHER
        value: "1"
      - key: VOUCHER_ACTIVATION_TTL_DAYS
        value: "30"
      - key: SESSION_REAPER_INTERVAL_SECONDS
        value: "30"
      - key: ROUTER_DISCONNECT_WEBHOOK_URL
        sync: false
      - key: RATE_LIMIT_STORAGE_URL
        sync: false
