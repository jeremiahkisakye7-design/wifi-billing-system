services:
  - type: web
    name: wifi-billing-system
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 4 --threads 4 --timeout 30
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: PAYMENT_PROVIDER
        sync: false
      - key: MTN_MERCHANT_CODE
        sync: false
      - key: MTN_COLLECTION_PRIMARY_KEY
        sync: false
      - key: MTN_API_USER
        sync: false
      - key: MTN_API_KEY
        sync: false
      - key: MTN_TARGET_ENVIRONMENT
        sync: false
      - key: AIRTEL_MERCHANT_CODE
        sync: false
      - key: AIRTEL_CLIENT_ID
        sync: false
      - key: AIRTEL_CLIENT_SECRET
        sync: false
      - key: AIRTEL_TARGET_ENVIRONMENT
        sync: false
      - key: PAYMENT_CALLBACK_BASE_URL
        sync: false
      - key: PAYMENT_WEBHOOK_SECRET
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: MANUAL_PAYMENT_RECIPIENT
        sync: false
      - key: SUPPORT_INQUIRY_NUMBER
        sync: false
      - key: ROUTER_API_KEY
        sync: false
      - key: ROUTER_DISCONNECT_WEBHOOK_URL
        sync: false
      - key: RATE_LIMIT_STORAGE_URL
        sync: false
